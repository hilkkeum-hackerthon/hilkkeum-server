openapi: 3.0.3
info:
  title: 힐끔(hilkkeum) API
  version: 1.0.0
  description: |
    커플 미션 추리 게임 API 명세.

    ## 공통
    - **Base URL**: `http://13.124.37.247` (nginx 게이트웨이가 경로별로 Spring / Node로 전달)
    - **인증**: 로그인 없음. 방 생성·입장 시 발급되는 `memberToken`을 모든 요청 헤더에 담는다 → 우측 상단 **Authorize** 버튼에 입력
    - **에러 응답**: `{ "code": "ERROR_CODE", "message": "사용자 안내 문구" }`
    - **상대 상태 동기화**: 폴링(2~3초). 앱은 서버의 `status` 값만 보고 화면을 그린다.

    ## 담당 서버
    | 태그 | 서버 | 상태 |
    |---|---|---|
    | 방·사용자, 스탬프·소원권, 내부 서버연동 | **Spring** | ✅ 구현 완료 (응답 형식 확정) |
    | 게임 설정, 미션·벌칙, 데이트 진행, 추리·채점, 결산, 동점처리 | **Node** | 🚧 구현 예정 (요청은 명세 기준, 응답은 **제안 형식**) |

    ## 라운드(게임) 상태
    `WAITING`(대기) → `SETTING`(설정) → `PLAYING`(진행 중) → `END_REQUESTED`(종료 요청) → `SCORING`(추리/채점) → `SETTLEMENT`(결산, 동점 시 가위바위보) → `FINISHED`(완료)
servers:
  - url: http://13.124.37.247
    description: 운영 (EC2)
  - url: http://localhost:8080
    description: 로컬 Spring (방·스탬프·소원권만)

tags:
  - name: 방·사용자
    description: "[Spring] 방 생성, 초대 코드 입장, 입장 상태 조회(재접속·대기 화면)"
  - name: 게임 설정
    description: "[Node] 라운드 생성 및 상태·진행현황"
  - name: 미션·벌칙
    description: "[Node] 미션·벌칙 목록, 내 비밀 미션 선택, 상대 벌칙 선택"
  - name: 데이트 진행
    description: "[Node] 데이트 종료 요청 · 응답"
  - name: 추리·채점
    description: "[Node] 추리 제출, 받은 추리 조회, 내 미션 O/X, 정답 판정"
  - name: 결산
    description: "[Node] 점수 · 승패 · 미션 · 벌칙 공개"
  - name: 동점처리
    description: "[Node] 동점 시 가위바위보"
  - name: 스탬프·소원권
    description: "[Spring] 스탬프 조회, 소원권 교환 · 조회 · 사용 요청 · 사용 응답"
  - name: 내부 서버연동
    description: "[Spring] Node → Spring 전용. 외부에서는 nginx가 차단(404), docker 내부망 `http://spring:8080`으로만 호출"

paths:
  # ───────────────────────── 방·사용자 (Spring) ─────────────────────────
  /api/v1/rooms:
    post:
      tags: [방·사용자]
      summary: 방 생성
      description: 초대 코드 6자리 발급, 생성자(방장) room_members 등록, 개인 memberToken 발급. 앱은 `roomId`·`memberToken`을 저장해 재접속에 사용한다.
      operationId: createRoom
      security: []
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRoomResponse' }

  /api/v1/rooms/join:
    post:
      tags: [방·사용자]
      summary: 초대 코드 입장
      description: 유효한 코드 검사, 2명 정원 검증, 참여자 등록 및 개인 토큰 발급. 소문자·앞뒤 공백 입력도 허용.
      operationId: joinRoom
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinRoomRequest' }
      responses:
        '200':
          description: 입장 완료 (방 상태 ACTIVE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinRoomResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404':
          description: 잘못된 코드 → 재입력 안내 (`INVALID_INVITE_CODE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: INVALID_INVITE_CODE, message: 잘못된 초대 코드입니다. 다시 입력해 주세요. }
        '409':
          description: 정원 초과 → 이미 사용된 코드 (`INVITE_CODE_ALREADY_USED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: INVITE_CODE_ALREADY_USED, message: 이미 사용된 초대 코드입니다. }

  /api/v1/rooms/{roomId}:
    get:
      tags: [방·사용자]
      summary: 입장 상태 조회
      description: 방 상태 및 두 번째 참가자 입장 여부 조회(재접속·대기 화면 폴링). `partnerJoined=true`가 되면 설정 화면으로 이동. 본인 방만 조회 가능.
      operationId: getRoomStatus
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 다른 방 (`NOT_ROOM_MEMBER`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ───────────────────────── 게임 설정 (Node) ─────────────────────────
  /api/v1/games:
    post:
      tags: [게임 설정]
      summary: 게임 생성 및 기본 설정
      description: |
        [Node · 응답 제안] 방장이 온라인/오프라인 및 미션 개수를 설정하여 라운드 생성.
        - 방장(CREATOR)만 가능, 두 명 모두 입장한 방(ACTIVE)만 가능
        - 방당 진행 중 라운드 1개 (FINISHED 전 중복 생성 불가)
        - 미션 개수 1~3
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomId, dateType, missionCount]
              properties:
                roomId: { type: integer, format: int64, example: 1 }
                dateType: { $ref: '#/components/schemas/DateType' }
                missionCount: { type: integer, minimum: 1, maximum: 3, example: 2 }
                themeId: { type: integer, format: int64, nullable: true, example: 1 }
      responses:
        '201':
          description: 라운드 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/games/{gameId}:
    get:
      tags: [게임 설정]
      summary: 게임 상태·진행현황 조회
      description: "[Node · 응답 제안] 현재 라운드 status, 본인/상대 설정·제출 여부 반환. **상대의 미션·벌칙 등 비밀 정보는 제외.**"
      operationId: getGame
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── 미션·벌칙 (Node) ─────────────────────────
  /api/v1/missions:
    get:
      tags: [미션·벌칙]
      summary: 미션 목록 조회
      description: "[Node · 응답 제안] 선택한 데이트 유형(·테마)에 맞는 활성 미션 목록."
      operationId: getMissions
      parameters:
        - name: dateType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/DateType' }
        - name: themeId
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Mission' }

  /api/v1/penalties:
    get:
      tags: [미션·벌칙]
      summary: 벌칙 옵션 목록 조회
      description: "[Node · 응답 제안] DB의 활성 벌칙 옵션 목록."
      operationId: getPenalties
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Penalty' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/games/{gameId}/missions:
    post:
      tags: [미션·벌칙]
      summary: 내 비밀 미션 선택
      description: "[Node · 응답 제안] 미션 개수와 유형(테마·데이트 유형) 검증 후 내 미션 저장. 상대에게 비공개."
      operationId: selectMyMissions
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [missionIds]
              properties:
                missionIds:
                  type: array
                  items: { type: integer, format: int64 }
                  minItems: 1
                  maxItems: 3
                  example: [3, 7]
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/games/{gameId}/penalty:
    post:
      tags: [미션·벌칙]
      summary: 상대 벌칙 선택
      description: "[Node · 응답 제안] DB 옵션 중 상대에게 줄 벌칙 1개 저장. 결산 전 비공개. (명세서 URL이 `/pen...`으로 잘려 있어 `/penalty`로 표기 — 확정 필요)"
      operationId: selectPenalty
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [penaltyId]
              properties:
                penaltyId: { type: integer, format: int64, example: 2 }
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── 데이트 진행 (Node) ─────────────────────────
  /api/v1/games/{gameId}/end-request:
    post:
      tags: [데이트 진행]
      summary: 데이트 종료 요청
      description: "[Node · 응답 제안] 상대에게 종료 승인 대기 상태(END_REQUESTED) 생성. 중복 요청 방지."
      operationId: requestEnd
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: 종료 요청됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/games/{gameId}/end-response:
    post:
      tags: [데이트 진행]
      summary: 데이트 종료 요청에 응답
      description: "[Node · 응답 제안] 수락 시 추리/채점 단계(SCORING) 전환, 거절 시 PLAYING 복귀. 요청한 본인은 응답 불가."
      operationId: respondEnd
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted]
              properties:
                accepted: { type: boolean, example: true }
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── 추리·채점 (Node) ─────────────────────────
  /api/v1/games/{gameId}/guesses:
    post:
      tags: [추리·채점]
      summary: 상대 미션 추리 일괄 제출
      description: "[Node · 응답 제안] 미션 개수만큼 텍스트 추리 일괄 제출(각 1~30자). 제출 후 수정 불가."
      operationId: submitGuesses
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guesses]
              properties:
                guesses:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items:
                    type: object
                    required: [guessNo, content]
                    properties:
                      guessNo: { type: integer, minimum: 1, maximum: 3, example: 1 }
                      content: { type: string, minLength: 1, maxLength: 30, example: 내 음료를 한 입 뺏어 먹었다 }
      responses:
        '201':
          description: 제출 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/games/{gameId}/received-guesses:
    get:
      tags: [추리·채점]
      summary: 상대가 보낸 추리 조회
      description: "[Node · 응답 제안] 상대방이 내 미션을 추측한 답 목록(채점용). 판정할 때 내 미션 목록과 함께 보여준다."
      operationId: getReceivedGuesses
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  myMissions:
                    type: array
                    items: { $ref: '#/components/schemas/PlayerMission' }
                  receivedGuesses:
                    type: array
                    items: { $ref: '#/components/schemas/Guess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/games/{gameId}/mission-reviews:
    post:
      tags: [추리·채점]
      summary: 내 미션 수행 O/X 제출
      description: "[Node · 응답 제안] 내 미션별 수행 여부 O/X 일괄 저장. 중복 제출 방지."
      operationId: submitMissionReviews
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviews]
              properties:
                reviews:
                  type: array
                  items:
                    type: object
                    required: [playerMissionId, isCompleted]
                    properties:
                      playerMissionId: { type: integer, format: int64, example: 11 }
                      isCompleted: { type: boolean, example: true }
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/games/{gameId}/judgement:
    post:
      tags: [추리·채점]
      summary: 상대 추리 정답 O/X 판정
      description: "[Node · 응답 제안] 미션 소유자가 상대 추리의 정답 여부를 판정. 중복 판정 방지. (명세서 URL 앞 `/` 누락 → `/api/v1/...`로 표기)"
      operationId: submitJudgements
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [judgments]
              properties:
                judgments:
                  type: array
                  items:
                    type: object
                    required: [guessId, isCorrect]
                    properties:
                      guessId: { type: integer, format: int64, example: 21 }
                      isCorrect: { type: boolean, example: false }
      responses:
        '200':
          description: 저장 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameStatusResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── 결산 (Node) ─────────────────────────
  /api/v1/games/{gameId}/result:
    get:
      tags: [결산]
      summary: 결산 결과 조회
      description: |
        [Node · 응답 제안] 양쪽 채점 완료 후 점수·승패·미션·벌칙 공개. 동점이면 가위바위보 진행(`tie=true`).
        - 점수(내 기준): 내 미션 실패 −1, 상대가 맞힘 −1, 상대가 틀림 +1
        - 승자 확정 시 Node가 `POST /internal/v1/stamps/award` 호출 → 승자 스탬프 +1
      operationId: getResult
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameResultResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── 동점처리 (Node) ─────────────────────────
  /api/v1/games/{gameId}/rps/moves:
    post:
      tags: [동점처리]
      summary: 가위바위보 선택
      description: "[Node · 응답 제안] 동점 시 가위바위보 선택 제출. 한 판에 한 번만. 비기면 다음 판(roundNo+1)."
      operationId: submitRpsMove
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [choice]
              properties:
                choice: { $ref: '#/components/schemas/RpsChoice' }
      responses:
        '201':
          description: 제출 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpsResultResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/games/{gameId}/rps/result:
    get:
      tags: [동점처리]
      summary: 가위바위보 결과 조회
      description: "[Node · 응답 제안] 양측 제출 후 결과·재대결 여부 조회. 상대가 아직 안 냈으면 상대 선택은 숨김."
      operationId: getRpsResult
      parameters:
        - $ref: '#/components/parameters/GameId'
        - name: roundNo
          in: query
          required: false
          description: 생략 시 최신 판
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpsResultResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────── 스탬프·소원권 (Spring) ─────────────────────────
  /api/v1/stamps:
    get:
      tags: [스탬프·소원권]
      summary: 스탬프 조회
      description: 보유 스탬프 및 교환 가능 여부 조회.
      operationId: getStamps
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StampsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/coupons/exchange:
    post:
      tags: [스탬프·소원권]
      summary: 소원권 교환
      description: 스탬프 3개 차감 후 소원권 발급. 만료일 = 발급일 + 1개월. 동시에 여러 번 눌러도 한 장만 발급.
      operationId: exchangeCoupon
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coupon' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 스탬프 부족 (`NOT_ENOUGH_STAMPS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: NOT_ENOUGH_STAMPS, message: 스탬프가 3개 이상 있어야 소원권으로 교환할 수 있습니다. }

  /api/v1/coupons:
    get:
      tags: [스탬프·소원권]
      summary: 소원권 조회
      description: |
        소원권 상태 및 만료일 조회. 조회 시점에 만료된 소원권은 자동으로 `EXPIRED` 처리.
        - `pendingApprovals`: 상대가 사용 요청해서 **내가 승인해야 하는** 소원권 → 앱은 폴링하다가 값이 있으면 승인 요청 알림 표시
      operationId: getCoupons
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CouponsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/coupons/{couponId}/use-request:
    post:
      tags: [스탬프·소원권]
      summary: 소원권 사용 요청
      description: 상대에게 사용 확인 요청 (`AVAILABLE` → `USE_REQUESTED`). 본인 소원권만, 만료 전에만 가능.
      operationId: requestCouponUse
      parameters:
        - $ref: '#/components/parameters/CouponId'
      responses:
        '200':
          description: 요청됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coupon' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 상대의 소원권 (`NOT_COUPON_OWNER`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: 없거나 다른 방의 소원권 (`COUPON_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: 사용 요청 불가 상태 (`COUPON_NOT_AVAILABLE`) 또는 만료 (`COUPON_EXPIRED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/coupons/{couponId}/respond:
    post:
      tags: [스탬프·소원권]
      summary: 소원권 사용 응답
      description: 상대의 사용 확인 처리. 승인 → `USED`, 거절 → `AVAILABLE`(다시 요청 가능). 소원권 주인은 응답 불가.
      operationId: respondCouponUse
      parameters:
        - $ref: '#/components/parameters/CouponId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean, example: true }
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Coupon' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 본인 소원권 (`CANNOT_RESPOND_OWN_COUPON`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: 없거나 다른 방의 소원권 (`COUPON_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: 사용 요청 중이 아님 (`COUPON_NOT_REQUESTED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ───────────────────────── 내부 서버연동 (Spring) ─────────────────────────
  /internal/v1/stamps/award:
    post:
      tags: [내부 서버연동]
      summary: 스탬프 적립 연동
      description: |
        결산 승자에게 스탬프 1개 적립. **Node → Spring 전용** (`http://spring:8080`, 외부에서는 404).
        게임당 1회만 적립(멱등) — 같은 gameId로 재호출하면 `awarded=false`로 응답하므로 재시도해도 안전.
      operationId: awardStamp
      security: []
      parameters:
        - name: X-Internal-Key
          in: header
          required: false
          description: 서버에 INTERNAL_API_KEY가 설정된 경우에만 필요
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gameId, winnerMemberId]
              properties:
                gameId: { type: integer, format: int64, example: 1 }
                winnerMemberId: { type: integer, format: int64, example: 1 }
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AwardStampResponse' }
        '400':
          description: 승자가 해당 게임 방의 참여자가 아님 (`WINNER_NOT_IN_GAME_ROOM`) 또는 필드 누락
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: 게임/멤버 없음 (`GAME_NOT_FOUND`, `MEMBER_NOT_FOUND`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

security:
  - memberToken: []

components:
  securitySchemes:
    memberToken:
      type: apiKey
      in: header
      name: memberToken
      description: 방 생성·입장 응답으로 받은 memberToken (43자)

  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      schema: { type: integer, format: int64, example: 1 }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: integer, format: int64, example: 1 }
    CouponId:
      name: couponId
      in: path
      required: true
      schema: { type: integer, format: int64, example: 1 }

  responses:
    Unauthorized:
      description: memberToken 없음/무효 (`MEMBER_TOKEN_MISSING`, `MEMBER_TOKEN_INVALID`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: MEMBER_TOKEN_INVALID, message: 유효하지 않은 memberToken입니다. }
    Forbidden:
      description: 권한 없음 (다른 방, 방장 전용 기능 등)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 현재 상태에서 할 수 없는 요청 (단계 불일치, 중복 제출 등)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidRequest:
      description: 요청 형식 오류 (`INVALID_REQUEST`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        code: { type: string, example: INVALID_REQUEST }
        message: { type: string, example: 잘못된 요청입니다. }

    MemberRole:
      type: string
      enum: [CREATOR, JOINER]
      description: CREATOR=방장, JOINER=참여자
    RoomStatus:
      type: string
      enum: [PENDING, ACTIVE, CLOSED]
      description: PENDING=상대 입장 대기, ACTIVE=두 명 입장 완료
    DateType:
      type: string
      enum: [ONLINE, OFFLINE]
    GameStatus:
      type: string
      enum: [WAITING, SETTING, PLAYING, END_REQUESTED, SCORING, SETTLEMENT, FINISHED]
    CouponStatus:
      type: string
      enum: [AVAILABLE, USE_REQUESTED, USED, EXPIRED]
    RpsChoice:
      type: string
      enum: [ROCK, PAPER, SCISSORS]

    CreateRoomResponse:
      type: object
      properties:
        roomId: { type: integer, format: int64, example: 1 }
        inviteCode: { type: string, example: XYZN2H, description: 6자리 초대 코드 (0/O·1/I/L 제외) }
        memberToken: { type: string, example: TtG75lJAy453UP3LPYOLj7CP0LxPzlOBRzYHOmnoW8Y }
        role: { $ref: '#/components/schemas/MemberRole' }
        status: { $ref: '#/components/schemas/RoomStatus' }
    JoinRoomRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode: { type: string, example: XYZN2H }
    JoinRoomResponse:
      type: object
      properties:
        roomId: { type: integer, format: int64, example: 1 }
        memberToken: { type: string, example: CwxPmmL6kOAZ-PhQQTxXswtUOCU2wD6sL0qWsW35Du0 }
        role: { $ref: '#/components/schemas/MemberRole' }
        status: { $ref: '#/components/schemas/RoomStatus' }
    RoomStatusResponse:
      type: object
      properties:
        roomId: { type: integer, format: int64, example: 1 }
        status: { $ref: '#/components/schemas/RoomStatus' }
        inviteCode: { type: string, nullable: true, example: XYZN2H, description: PENDING일 때만 (대기 화면에서 다시 복사) }
        myRole: { $ref: '#/components/schemas/MemberRole' }
        memberCount: { type: integer, example: 2 }
        partnerJoined: { type: boolean, example: true }

    PlayerProgress:
      type: object
      description: 각 플레이어의 설정·제출 여부 (비밀 내용 제외)
      properties:
        memberId: { type: integer, format: int64 }
        missionSelected: { type: boolean }
        penaltySelected: { type: boolean }
        guessesSubmitted: { type: boolean }
        missionReviewed: { type: boolean }
        judged: { type: boolean }
    GameStatusResponse:
      type: object
      description: "[제안] 라운드 상태 · 진행현황"
      properties:
        gameId: { type: integer, format: int64, example: 1 }
        roomId: { type: integer, format: int64, example: 1 }
        status: { $ref: '#/components/schemas/GameStatus' }
        dateType: { $ref: '#/components/schemas/DateType' }
        themeId: { type: integer, format: int64, nullable: true }
        missionCount: { type: integer, example: 2 }
        endRequestedByMe: { type: boolean, nullable: true, description: END_REQUESTED일 때 내가 요청했는지 }
        me: { $ref: '#/components/schemas/PlayerProgress' }
        partner: { $ref: '#/components/schemas/PlayerProgress' }
    Mission:
      type: object
      properties:
        missionId: { type: integer, format: int64, example: 3 }
        themeId: { type: integer, format: int64, example: 1 }
        dateType: { $ref: '#/components/schemas/DateType' }
        content: { type: string, example: 상대 음료 한 입 뺏어 먹기 }
    Penalty:
      type: object
      properties:
        penaltyId: { type: integer, format: int64, example: 2 }
        content: { type: string, example: 애교 3종 세트 }
    PlayerMission:
      type: object
      properties:
        playerMissionId: { type: integer, format: int64, example: 11 }
        missionId: { type: integer, format: int64, example: 3 }
        content: { type: string, example: 상대 음료 한 입 뺏어 먹기 }
        isCompleted: { type: boolean, nullable: true }
    Guess:
      type: object
      properties:
        guessId: { type: integer, format: int64, example: 21 }
        guessNo: { type: integer, example: 1 }
        content: { type: string, example: 내 음료를 한 입 뺏어 먹었다 }
        isCorrect: { type: boolean, nullable: true, description: 판정 전 null }
    PlayerResult:
      type: object
      properties:
        memberId: { type: integer, format: int64 }
        score: { type: integer, example: 1 }
        result: { type: string, enum: [WIN, LOSE], nullable: true }
        missions:
          type: array
          items: { $ref: '#/components/schemas/PlayerMission' }
        penaltyForOpponent: { $ref: '#/components/schemas/Penalty' }
    GameResultResponse:
      type: object
      description: "[제안] 결산 결과 (양쪽 채점 완료 후 공개)"
      properties:
        gameId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/GameStatus' }
        tie: { type: boolean, description: true면 가위바위보 진행 }
        decidedBy: { type: string, enum: [SCORE, RPS], nullable: true }
        winnerMemberId: { type: integer, format: int64, nullable: true }
        me: { $ref: '#/components/schemas/PlayerResult' }
        partner: { $ref: '#/components/schemas/PlayerResult' }
    RpsResultResponse:
      type: object
      description: "[제안] 가위바위보 결과"
      properties:
        roundNo: { type: integer, example: 1 }
        myChoice: { $ref: '#/components/schemas/RpsChoice' }
        partnerChoice:
          allOf: [{ $ref: '#/components/schemas/RpsChoice' }]
          nullable: true
          description: 상대가 아직 안 냈으면 null
        outcome: { type: string, enum: [WAITING, WIN, LOSE, DRAW], description: DRAW면 다음 판 }
        nextRoundNo: { type: integer, nullable: true }

    StampsResponse:
      type: object
      properties:
        stampCount: { type: integer, example: 4 }
        stampsPerCoupon: { type: integer, example: 3 }
        exchangeable: { type: boolean, example: true }
    AwardStampResponse:
      type: object
      properties:
        gameId: { type: integer, format: int64, example: 1 }
        winnerMemberId: { type: integer, format: int64, example: 1 }
        awarded: { type: boolean, example: true, description: false면 이미 적립된 게임 }
        stampCount: { type: integer, example: 1 }
    Coupon:
      type: object
      properties:
        couponId: { type: integer, format: int64, example: 1 }
        ownerMemberId: { type: integer, format: int64, example: 1 }
        status: { $ref: '#/components/schemas/CouponStatus' }
        issuedAt: { type: string, format: date-time, example: '2026-11-22T02:14:37' }
        expiresAt: { type: string, format: date-time, example: '2026-12-22T02:14:37' }
        useRequestedAt: { type: string, format: date-time, nullable: true }
        respondedAt: { type: string, format: date-time, nullable: true }
        usedAt: { type: string, format: date-time, nullable: true }
    CouponsResponse:
      type: object
      properties:
        stampCount: { type: integer, example: 1 }
        myCoupons:
          type: array
          items: { $ref: '#/components/schemas/Coupon' }
        pendingApprovals:
          type: array
          description: 상대가 사용 요청해서 내가 승인해야 하는 소원권
          items: { $ref: '#/components/schemas/Coupon' }
