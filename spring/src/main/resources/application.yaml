server:
  port: ${PORT:8080}

spring:
  application:
    name: hilkkeum

  # DB 접속 정보는 환경변수로 주입 (운영: compose.prod.yaml + EC2 .env.prod / 로컬: compose.local.yaml 기본값)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hilkkeum}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:hilkkeum_user}
    password: ${DB_PASSWORD:hilkkeum_local}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 스키마는 db/init/01_schema.sql 한 곳에서만 관리 → 엔티티가 스키마와 맞는지만 검증
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

# 내부 API(/internal/**) 보호용 공유 키. 비워 두면 검사하지 않음(nginx 차단 + docker 내부망만으로 보호)
internal:
  api-key: ${INTERNAL_API_KEY:}

# Swagger UI: /swagger-ui/index.html
# 코드 자동 생성 문서 대신, Spring·Node 전체 API를 담은 명세 파일(static/openapi.yaml)을 보여준다.
springdoc:
  swagger-ui:
    url: /openapi.yaml
    path: /swagger-ui.html
    display-request-duration: true
    doc-expansion: none          # 태그만 펼친 상태로 시작 (명세서 순서 유지)
    persist-authorization: true  # 새로고침해도 Authorize에 넣은 memberToken 유지

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
