server:
  port: ${PORT:8080}

spring:
  application:
    name: hilkkeum

  # DB 접속 정보는 환경변수로 주입 (운영: compose.prod.yaml + EC2 .env.prod / 로컬: compose.local.yaml 기본값)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hilkkeum}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:hilkkeum_user}
    password: ${DB_PASSWORD:hilkkeum_local}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # 스키마는 db/init/01_schema.sql 한 곳에서만 관리 → 엔티티가 스키마와 맞는지만 검증
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

  jackson:
    time-zone: Asia/Seoul

# 내부 API(/internal/**) 보호용 공유 키. 비워 두면 검사하지 않음(nginx 차단 + docker 내부망만으로 보호)
internal:
  api-key: ${INTERNAL_API_KEY:}

# Swagger UI (Spring API): /swagger-ui.html · 명세 JSON: /v3/api-docs
# Node(게임) API 문서는 Node가 /swagger 에서 별도 제공
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    persist-authorization: true
    doc-expansion: list
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
