name: Deploy Hilkkeum Server

# 지금은 수동 배포만 허용 (GitHub → Actions → Deploy Hilkkeum Server → Run workflow)
# main push 자동 배포를 켜려면 아래 push 블록의 주석을 해제하세요. (테스트 → 빌드 → 배포 → 헬스체크)
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

# 연속 push 시 배포가 겹치지 않도록 하나씩 순서대로 실행
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # 테스트가 실패하면 이미지 빌드·배포를 진행하지 않음
  test:
    name: Spring Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spring
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: gradle

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    outputs:
      spring_image: ${{ steps.meta.outputs.spring_image }}
      node_image: ${{ steps.meta.outputs.node_image }}
      has_node: ${{ steps.meta.outputs.has_node }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 이미지 경로는 소문자만 허용 / Node 코드가 아직 없으면 Node 빌드·배포는 건너뜀
      - name: Set image paths
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "spring_image=${REGISTRY}/${OWNER}/hilkkeum-spring" >> "$GITHUB_OUTPUT"
          echo "node_image=${REGISTRY}/${OWNER}/hilkkeum-node" >> "$GITHUB_OUTPUT"
          if [ -f node/package.json ]; then echo "has_node=true" >> "$GITHUB_OUTPUT"; else echo "has_node=false" >> "$GITHUB_OUTPUT"; fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Spring image
        uses: docker/build-push-action@v5
        with:
          context: ./spring
          push: true
          tags: |
            ${{ steps.meta.outputs.spring_image }}:latest
            ${{ steps.meta.outputs.spring_image }}:${{ github.sha }}
          cache-from: type=gha,scope=spring
          cache-to: type=gha,mode=max,scope=spring

      - name: Build and push Node image
        if: steps.meta.outputs.has_node == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./node
          push: true
          tags: |
            ${{ steps.meta.outputs.node_image }}:latest
            ${{ steps.meta.outputs.node_image }}:${{ github.sha }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # compose · nginx 설정 · DB 초기화 스크립트를 서버에 동기화
      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.prod.yaml,db/init,nginx"
          target: "~/hilkkeum"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd ~/hilkkeum
            export SPRING_IMAGE=${{ needs.build-and-push.outputs.spring_image }}:latest
            export NODE_IMAGE=${{ needs.build-and-push.outputs.node_image }}:latest
            COMPOSE="docker compose --env-file .env.prod -f compose.prod.yaml"

            SERVICES="spring nginx"
            if [ "${{ needs.build-and-push.outputs.has_node }}" = "true" ]; then SERVICES="$SERVICES node"; fi
            echo "deploy services: $SERVICES"

            $COMPOSE pull $SERVICES
            # mysql은 유지(없으면 기동), 앱 컨테이너만 교체. 이전 구성의 컨테이너는 정리
            $COMPOSE up -d mysql
            $COMPOSE up -d --no-deps --remove-orphans $SERVICES

            # 헬스체크: Spring + DB가 응답할 때까지 최대 2분 대기
            for i in $(seq 1 40); do
              if curl -sf http://localhost/health > /dev/null; then echo "health OK"; break; fi
              if [ "$i" = "40" ]; then echo "health check failed"; $COMPOSE ps; $COMPOSE logs --tail 50 spring; exit 1; fi
              sleep 3
            done

            docker image prune -f
