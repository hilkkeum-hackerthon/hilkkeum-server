name: Deploy Hilkkeum Server

# 지금은 수동 배포만 허용 (GitHub → Actions → Deploy Hilkkeum Server → Run workflow)
# main push 자동 배포를 켜려면 아래 push 블록의 주석을 해제하세요.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hilkkeum-server

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 이미지 경로는 소문자만 허용
      - name: Set image path
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # compose 파일과 DB 초기화 스크립트를 서버에 동기화
      - name: Copy deploy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "compose.prod.yaml,db/init"
          target: "~/hilkkeum"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd ~/hilkkeum
            export SERVER_IMAGE=${{ needs.build-and-push.outputs.image }}:latest

            # 최신 이미지 pull
            docker compose --env-file .env.prod -f compose.prod.yaml pull server

            # mysql은 유지, server만 재시작 (mysql이 없으면 함께 기동)
            docker compose --env-file .env.prod -f compose.prod.yaml up -d mysql
            docker compose --env-file .env.prod -f compose.prod.yaml up -d --no-deps server

            # 오래된 이미지 정리
            docker image prune -f
