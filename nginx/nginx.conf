# 힐끔 API 게이트웨이 — 앱은 http://<탄력적IP>/ 하나만 알면 된다.
#   /api/v1/rooms, /api/v1/coupons → Spring
#   그 외 /api/**                   → Node (게임)
#   /internal/**, /actuator/**      → 외부 차단 (서버 간 호출은 docker 내부망으로만)

server {
    listen 80;
    server_name _;

    # docker 내부 DNS를 요청 시점에 조회 → 컨테이너가 없거나 재시작돼도 nginx는 죽지 않음(503 응답)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $spring http://spring:8080;
    set $node   http://node:3000;

    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 서버 간 내부 API · 관리용 엔드포인트는 외부에서 접근 불가
    location /internal/ { return 404 '{"code":"NOT_FOUND","message":"요청한 리소스를 찾을 수 없습니다."}'; }
    location /actuator/ { return 404 '{"code":"NOT_FOUND","message":"요청한 리소스를 찾을 수 없습니다."}'; }

    # 배포 확인용 헬스체크 (Spring + DB 상태)
    location = /health {
        set $spring_health http://spring:8080/actuator/health;
        proxy_pass $spring_health;
    }

    # Spring: 방 · 스탬프 · 소원권
    location /api/v1/rooms   { proxy_pass $spring; }
    location /api/v1/stamps  { proxy_pass $spring; }
    location /api/v1/coupons { proxy_pass $spring; }

    # API 문서 (Swagger UI · OpenAPI 명세) — Spring이 제공
    location /swagger-ui      { proxy_pass $spring; }
    location = /openapi.yaml  { proxy_pass $spring; }
    location /v3/api-docs     { proxy_pass $spring; }

    # Node: 그 외 API (게임)
    location /api/ { proxy_pass $node; }

    location / { return 404 '{"code":"NOT_FOUND","message":"요청한 리소스를 찾을 수 없습니다."}'; }

    # 대상 서버가 아직 없거나 재시작 중일 때
    error_page 502 503 504 = @unavailable;
    location @unavailable {
        default_type application/json;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"서버를 준비 중입니다. 잠시 후 다시 시도해 주세요."}';
    }

    default_type application/json;
    charset utf-8;
}
