# 운영(EC2) 구성: nginx(:80) → spring(:8080) / node(:3000) → mysql(:3306)
# 외부에 열리는 포트는 nginx 80번 하나. spring·node·mysql은 docker 내부망에서만 접근 가능.
services:
  mysql:
    image: mysql:8.0
    container_name: hilkkeum-mysql
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 볼륨이 비어 있을 때(최초 1회)만 실행됨
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - hilkkeum-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  spring:
    image: ${SPRING_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/hilkkeum-spring:latest}
    container_name: hilkkeum-spring
    environment:
      - PORT=8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hilkkeum-network
    restart: unless-stopped

  node:
    image: ${NODE_IMAGE:-ghcr.io/${GITHUB_REPOSITORY_OWNER}/hilkkeum-node:latest}
    container_name: hilkkeum-node
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # 승자 스탬프 적립: POST ${SPRING_INTERNAL_URL}/internal/v1/stamps/award
      - SPRING_INTERNAL_URL=http://spring:8080
      - TZ=Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - hilkkeum-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hilkkeum-nginx
    ports:
      - "80:80"   # 안드로이드 앱 → http://<탄력적IP>/
    volumes:
      # 파일이 아닌 폴더 단위로 연결 → 배포 시 nginx.conf가 교체돼도 컨테이너가 새 파일을 봄 (reload로 반영)
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - hilkkeum-network
    restart: unless-stopped

networks:
  hilkkeum-network:
    driver: bridge

volumes:
  mysql_data:
